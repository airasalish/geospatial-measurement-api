name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check
        run: mypy app
      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  postgis:
    # The full API suite again, against real PostgreSQL + PostGIS: migrations, the
    # GiST-indexed geom column and ST_AsMVT vector tiles.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: geo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GEO_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/geo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test against PostGIS
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, postgis, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t geo-api .
      - name: Smoke test
        run: |
          docker run -d --name geo -p 8000:8000 geo-api
          for i in $(seq 1 60); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs localhost:8000/health || { docker logs geo; exit 1; }
          curl -fs localhost:8000/ | grep -q "<title>Traverse"
          curl -fs -F "file=@samples/site_survey.kml" localhost:8000/api/files/ | tee /dev/stderr | grep -q '"status":"COMPLETED"'
