# Full production-shaped stack on one machine:
#
#   docker compose up --build
#
# UI + API ......... http://localhost:8000   (API docs at /docs, metrics at /metrics)
# S3 (SeaweedFS) ... http://localhost:8333   (access key traverse / traverse-secret)
# Prometheus ....... http://localhost:9090
#
# The API returns 202 for uploads and a Celery worker processes them. Uploads and
# COGs live in S3-compatible storage (SeaweedFS here; AWS S3 in production); GDAL
# reads COGs in place via /vsis3/. Features go to PostGIS (GiST-indexed geometry,
# ST_AsMVT vector tiles).

x-app-env: &app-env
  GEO_DATABASE_URL: postgresql+psycopg://traverse:traverse@db:5432/traverse
  GEO_STORAGE_BACKEND: s3
  GEO_S3_ENDPOINT_URL: http://s3:8333
  GEO_S3_BUCKET: traverse
  GEO_S3_ACCESS_KEY: traverse
  GEO_S3_SECRET_KEY: traverse-secret
  GEO_TASK_MODE: celery
  GEO_REDIS_URL: redis://redis:6379/0
  GEO_LOG_FORMAT: json

services:
  api:
    build: .
    image: traverse:local
    environment: *app-env
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build: .
    image: traverse:local
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *app-env
    healthcheck:
      # The image's default healthcheck probes HTTP; a worker serves none, so ask
      # the worker itself over the broker.
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 15s
      timeout: 15s
      start_period: 20s
      retries: 5
    depends_on:
      api: { condition: service_healthy }  # the API applies migrations first

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: traverse
      POSTGRES_PASSWORD: traverse
      POSTGRES_DB: traverse
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traverse -d traverse"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    # SeaweedFS: Apache-2.0, S3-compatible object store (MinIO no longer ships
    # public images). Any S3 endpoint works; point GEO_S3_ENDPOINT_URL at it.
    image: chrislusf/seaweedfs:4.47
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - s3data:/data
      - ./deploy/s3.json:/etc/seaweedfs/s3.json:ro
    ports: ["8333:8333"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 5s
      retries: 30

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [api]

volumes:
  pgdata:
  s3data:
