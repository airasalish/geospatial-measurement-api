[project]
name = "geospatial-measurement-api"
version = "1.0.0"
description = "Upload Shapefile/KML/KMZ files and get accurate per-feature area and length measurements."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyshp>=2.3",
    "defusedxml>=0.7",
    "numpy>=1.26",
    "rasterio>=1.4",
    "scipy>=1.13",
    "rio-tiler>=7.0",
    "alembic>=1.13",
    "mapbox-vector-tile>=2.1",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Starlette nudges towards httpx2 for TestClient; httpx works and is the stable choice for now.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
    # Inside mapbox-vector-tile, not our code.
    "ignore::DeprecationWarning:mapbox_vector_tile.*",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT"]
ignore = [
    "S101",   # asserts in tests
    "S314",   # XML is parsed with defusedxml
    "RUF001",
    "N818",   # domain exception names (NotFound) read better without an Error suffix
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N802"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["shapefile.*", "shapely.*", "defusedxml.*", "rasterio.*", "scipy.*", "affine.*", "rio_tiler.*", "morecantile.*", "mapbox_vector_tile.*"]
ignore_missing_imports = true
